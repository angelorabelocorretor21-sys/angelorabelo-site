name: teste-reel-nuvem
on:
  push:
    branches: [reels-nuvem]
    paths: ['.github/workflows/teste.yml']
permissions:
  contents: write
jobs:
  teste:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          { curl -sS -o f.webp -w "foto:%{http_code} %{size_download}\n" -A "Mozilla/5.0" "https://rabeloimoveisoficial.com/uploads/imoveis/342/1291f469c366a30e7fb41e9fc96a2b8bb1c3f8fc14a8af40fc0e9d957043d7f4.webp";
            ffmpeg -version | head -1; python3 -c "import PIL;print('PIL',PIL.__version__)" 2>&1;
            curl -sS -o /dev/null -w "cloudinary:%{http_code}\n" https://api.cloudinary.com/v1_1/demo/image/upload; } > resultado.txt 2>&1
          git config user.name "Angelo Rabêlo"; git config user.email angelorabelo.corretor21@gmail.com
          git add resultado.txt; git commit -m "resultado teste"; git push
